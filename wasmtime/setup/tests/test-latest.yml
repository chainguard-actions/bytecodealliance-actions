name: Test setup wasmtime latest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert wasmtime is installed and on PATH
        run: |
          echo "which: $(command -v wasmtime || true)"
          if ! command -v wasmtime >/dev/null 2>&1; then
            echo "FAIL: wasmtime not found on PATH"
            exit 1
          fi
          OUT="$(wasmtime --version)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -qE '^wasmtime[- ]'; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          echo "PASS"
