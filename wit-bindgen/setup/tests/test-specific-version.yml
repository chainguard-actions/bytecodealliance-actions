name: Test setup wit-bindgen specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.16.0"
      - name: Assert wit-bindgen version
        run: |
          if ! command -v wit-bindgen >/dev/null 2>&1; then
            echo "FAIL: wit-bindgen not found on PATH"
            exit 1
          fi
          OUT="$(wit-bindgen --version)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q '0\.16\.0'; then
            echo "FAIL: expected version 0.16.0"
            exit 1
          fi
          echo "PASS"
