name: Test latest wasm-tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert wasm-tools installed and on PATH
        run: |
          if ! command -v wasm-tools >/dev/null 2>&1; then
            echo "FAIL: wasm-tools not on PATH"
            exit 1
          fi
          OUT="$(wasm-tools --version)"
          echo "version: $OUT"
          if ! echo "$OUT" | grep -qE 'wasm-tools [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          echo "PASS"
